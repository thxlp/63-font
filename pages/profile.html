<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/profile-style.css">
    <style>
        .profile-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .profile-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #6D2121;
            margin-bottom: 4px;
        }

        .profile-section-subtitle {
            font-size: 12px;
            color: #7b5b5b;
            margin-bottom: 10px;
        }

        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .avatar-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7d9d9, #fef5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(109, 33, 33, 0.15);
        }

        .btn-change-avatar {
            padding: 6px 12px;
            border-radius: 999px;
            border: none;
            background: rgba(109, 33, 33, 0.08);
            color: #6D2121;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-change-avatar:hover {
            background: rgba(109, 33, 33, 0.16);
        }

        .bmi-edit-grid,
        .password-edit-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .bmi-edit-item span {
            display: block;
            font-size: 11px;
            color: #6b4b4b;
            margin-bottom: 4px;
        }

        .bmi-edit-item input,
        .password-edit-grid input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            font-size: 13px;
            outline: none;
        }

        .bmi-edit-item input:focus,
        .password-edit-grid input:focus {
            border-color: #6D2121;
            box-shadow: 0 0 0 1px rgba(109, 33, 33, 0.15);
        }

        .bmi-edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .profile-message {
            margin: 8px 0 12px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .profile-message.success {
            background: #e6f4ea;
            color: #146c43;
            border: 1px solid #badbcc;
        }

        .profile-message.error {
            background: #fde2e1;
            color: #b02a37;
            border: 1px solid #f5c2c7;
        }

        @media (max-width: 480px) {
            .bmi-edit-grid,
            .password-edit-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="background-scene">
        <div class="leaf-float" style="top: 10%; left: 8%;"></div>
        <div class="leaf-float" style="top: 20%; right: 15%; transform: rotate(90deg);"></div>
        <div class="mountain m-1"></div>
        <div class="mountain m-2"></div>
        <div class="mountain m-3"></div>
    </div>

    <div class="app-container">
        
        <nav class="top-nav">
            <a href="main.html" class="nav-item">Main</a>
            <a href="profile.html" class="nav-item active">Profile</a>
        </nav>

        <div id="profileMessage" class="profile-message" style="display: none;"></div>

        <div class="card-glass profile-card">
            
            <div class="avatar-wrapper">
                <div class="avatar-icon">
                    <img id="avatarImage" alt="avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>
                <button class="btn-change-avatar" id="changeAvatarBtn" type="button">เปลี่ยนรูปโปรไฟล์</button>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
            </div>

            <div class="profile-content">
                
                <div class="profile-section-title">โปรไฟล์ของคุณ</div>
                <div class="profile-section-subtitle">จัดการข้อมูลบัญชีและข้อมูลสุขภาพของคุณได้จากหน้านี้</div>

                <div class="info-group">
                    <label>Username</label>
                    <div class="value-text" id="usernameValue">กำลังโหลด...</div>
                </div>

                <div class="info-group row-between">
                    <div class="pass-col">
                        <label>Password</label>
                        <div class="value-text pass-dots" id="passwordValue">•••••••••••••••</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <label>น้ำหนัก</label>
                        <div class="stat-val" id="weightValue">กำลังโหลด...</div>
                    </div>
                    <div class="stat-item">
                        <label>ส่วนสูง</label>
                        <div class="stat-val" id="heightValue">กำลังโหลด...</div>
                    </div>
                    <div class="stat-item">
                        <label>BMI</label>
                        <div class="stat-val" id="bmiValue">กำลังโหลด...</div>
                    </div>
                </div>

                <!-- ฟอร์มแก้ไข BMI / น้ำหนัก / ส่วนสูง -->
                <div class="info-group mt-3">
                    <button class="btn-history" type="button" id="toggleBmiEditBtn">แก้ไขข้อมูล BMI</button>
                </div>
                <div class="info-group mt-3" id="bmiEditSection" style="display: none;">
                    <label>แก้ไขข้อมูลร่างกาย (คำนวณ BMI และแคลอรี่ให้อัตโนมัติ)</label>
                    <div class="bmi-edit-grid">
                        <div class="bmi-edit-item">
                            <span>น้ำหนัก (กก.)</span>
                            <input type="number" id="editWeight" min="0" step="0.1">
                        </div>
                        <div class="bmi-edit-item">
                            <span>ส่วนสูง (ซม.)</span>
                            <input type="number" id="editHeight" min="0" step="0.1">
                        </div>
                    </div>
                    <div class="bmi-edit-actions">
                        <button type="button" class="btn-history" id="saveBmiBtn">บันทึก BMI</button>
                        <button type="button" class="btn-logout" id="cancelBmiBtn">ยกเลิก</button>
                    </div>
                </div>

                <div class="info-group mt-3">
                    <label>แคลอรี่ที่ควรได้รับ</label>
                    <div class="value-text" id="caloriesValue">กำลังโหลด...</div>
                </div>

                <!-- ฟอร์มเปลี่ยนรหัสผ่าน -->
                <!-- Password change removed: handled by backend/auth system -->

                <div class="info-group mt-3" style="margin-top: 20px;">
                    <button class="btn-history" onclick="openHistory()">ประวัติการทำรายการ</button>
                </div>

                <div class="info-group mt-3" style="margin-top: 15px;">
                    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
                </div>

            </div>
        </div>

    </div>

    <!-- Floating Cart Button -->
    <a href="cart.html" class="fab-cart">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="fab-badge" id="fabBadge" style="display: none;">0</span>
    </a>

    <script src="../scripts/cart.js"></script>
    <script src="../supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
    <script>
        // Supabase helper: configure via window.__SUPABASE_URL__/KEY or localStorage keys:
        //  - SUPABASE_URL
        //  - SUPABASE_KEY
        // Replace placeholders with your project values or set them in localStorage.
        function getSupabaseClient() {
            if (window.supabaseClient) return window.supabaseClient;
            const url = window.__SUPABASE_URL__ || localStorage.getItem('SUPABASE_URL') || 'REPLACE_WITH_YOUR_SUPABASE_URL';
            const key = window.__SUPABASE_KEY__ || localStorage.getItem('SUPABASE_KEY') || 'REPLACE_WITH_YOUR_SUPABASE_ANON_KEY';
            if (!url || !key || url.includes('REPLACE') || key.includes('REPLACE')) return null;
            try {
                window.supabaseClient = supabase.createClient(url, key);
                // If an access token exists in localStorage, set it for RLS-authenticated requests
                try {
                    const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                    if (token && window.supabaseClient && window.supabaseClient.auth && typeof window.supabaseClient.auth.setAuth === 'function') {
                        window.supabaseClient.auth.setAuth(token);
                        console.log('Supabase: set auth token from localStorage');
                    }
                } catch (e) {
                    console.warn('Supabase: failed to set auth token', e.message || e);
                }
                return window.supabaseClient;
            } catch (e) {
                console.error('Supabase init error:', e);
                return null;
            }
        }
    </script>
    <script>
        // ฟังก์ชันเปิดหน้าประวัติ
        function openHistory() {
            window.location.href = 'history.html';
        }

        // ฟังก์ชันออกจากระบบ
        function logout() {
            if (confirm('คุณต้องการออกจากระบบหรือไม่?')) {
                // ลบข้อมูลจาก localStorage
                localStorage.removeItem('token');
                localStorage.removeItem('authToken');
                localStorage.removeItem('userData');
                localStorage.removeItem('userId');
                localStorage.removeItem('user_id');
                localStorage.removeItem('isLoggedIn');
                
                console.log('✓ ออกจากระบบสำเร็จ - ลบข้อมูลจาก localStorage แล้ว');
                
                // Redirect ไปที่หน้า login
                window.location.href = 'login.html';
            }
        }

        // ฟังก์ชันดึงข้อมูลผู้ใช้
        async function fetchUserData() {
            console.log('=== เริ่มดึงข้อมูลผู้ใช้ ===');
            console.log('🔍 ตรวจสอบ localStorage...');
            
            // ดึง token หรือ authentication info จาก localStorage (ถ้ามี)
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            const savedUser = localStorage.getItem('userData');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userId = localStorage.getItem('userId') || localStorage.getItem('user_id');
            
            // ลองดึง user_id จาก userData ถ้ามี (สำคัญมากสำหรับ RLS)
            let user_id = userId;
            if (savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    // ลองดึง user_id จากหลายที่ (รองรับหลายรูปแบบ)
                    if (userData.id) {
                        user_id = userData.id;
                        // บันทึกกลับไป localStorage เพื่อใช้ในครั้งถัดไป
                        if (!userId) {
                            localStorage.setItem('userId', userData.id);
                            localStorage.setItem('user_id', userData.id);
                        }
                    } else if (userData.user_id) {
                        user_id = userData.user_id;
                        if (!userId) {
                            localStorage.setItem('userId', userData.user_id);
                            localStorage.setItem('user_id', userData.user_id);
                        }
                    } else if (userData.userId) {
                        user_id = userData.userId;
                        if (!userId) {
                            localStorage.setItem('userId', userData.userId);
                            localStorage.setItem('user_id', userData.userId);
                        }
                    }
                } catch (e) {
                    console.error('Error parsing userData for user_id:', e);
                }
            }
            
            // ถ้ายังไม่มี user_id ให้แสดงคำเตือน
            if (!user_id) {
                console.warn('⚠ ไม่พบ user_id - อาจมีปัญหาเมื่อดึงข้อมูลจาก bmi_records (RLS)');
                console.warn('   💡 Backend ควรส่ง user_id กลับมาหรือ frontend ต้องมี user_id');
            }
            
            console.log('Token:', token ? `✓ พบ (${token.substring(0, 20)}...)` : '✗ ไม่พบ');
            console.log('UserData:', savedUser ? '✓ พบ' : '✗ ไม่พบ');
            console.log('User ID (จาก localStorage):', userId ? `✓ พบ: ${userId}` : '✗ ไม่พบ');
            console.log('User ID (หลัง parse):', user_id ? `✓ พบ: ${user_id}` : '✗ ไม่พบ');
            console.log('IsLoggedIn:', isLoggedIn);
            
            // ถ้าไม่มี user_id แต่มี savedUser ให้ลอง parse อีกครั้ง
            if (!user_id && savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    console.log('🔍 ตรวจสอบ userData อีกครั้งเพื่อหา user_id...');
                    console.log('   Fields ใน userData:', Object.keys(userData));
                    
                    // ลองหาจากหลาย field
                    const possibleUserIdFields = ['id', 'user_id', 'userId', '_id', 'uid'];
                    for (const field of possibleUserIdFields) {
                        if (userData[field]) {
                            user_id = userData[field];
                            localStorage.setItem('userId', user_id);
                            localStorage.setItem('user_id', user_id);
                            console.log(`   ✓ พบ user_id ใน field "${field}": ${user_id}`);
                            break;
                        }
                    }
                } catch (e) {
                    console.error('   ✗ Error parsing userData:', e);
                }
            }
            
            if (!user_id) {
                console.warn('⚠⚠⚠ ไม่พบ user_id เลย!');
                console.warn('   💡 ต้องมี user_id เพื่อดึงข้อมูลจาก bmi_records (RLS)');
                console.warn('   💡 Backend ควรส่ง user_id กลับมาหลัง login');
            }
            
            // สร้าง headers สำหรับ API request
            const headers = {
                'Content-Type': 'application/json',
            };
            
            // เพิ่ม token ใน headers ถ้ามี
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
                console.log('✓ จะส่ง Bearer Token ไปกับ request');
            } else if (user_id) {
                console.log('✓ จะใช้ user_id ใน query parameter (fallback)');
            } else {
                console.warn('⚠ ไม่มี token และ user_id - API อาจจะ reject request');
            }
            
            // ลองดึงข้อมูลจาก localStorage ก่อน (แสดงผลทันที)
            if (savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    console.log('✓ พบข้อมูลใน localStorage:', userData);
                    console.log('   Fields ที่มี:', Object.keys(userData));
                    
                    // แสดงข้อมูลจาก localStorage ทันที (เพื่อให้ผู้ใช้เห็นข้อมูลเร็ว)
                    displayUserData(userData);
                    
                    // ตรวจสอบว่ามีข้อมูล weight, height, bmi, calories หรือไม่
                    const hasRequiredData = (userData.weight !== undefined && userData.weight !== null && userData.weight !== '') || 
                                          (userData.height !== undefined && userData.height !== null && userData.height !== '') || 
                                          (userData.bmi !== undefined && userData.bmi !== null && userData.bmi !== '') || 
                                          (userData.calories !== undefined && userData.calories !== null && userData.calories !== '');
                    
                    if (hasRequiredData) {
                        console.log('✓ ข้อมูลครบถ้วนใน localStorage - แต่จะ refresh จาก API');
                        // ยังคง refresh จาก API เพื่อให้ได้ข้อมูลล่าสุด
                    } else {
                        console.warn('⚠ ข้อมูลใน localStorage ไม่มี weight/height/bmi/calories');
                        console.warn('   weight:', userData.weight);
                        console.warn('   height:', userData.height);
                        console.warn('   bmi:', userData.bmi);
                        console.warn('   calories:', userData.calories);
                        console.warn('   💡 ข้อมูลจะแสดง username/email แต่ weight/height/bmi/calories จะแสดง "-"');
                    }
                } catch (e) {
                    console.error('✗ Error parsing saved user data:', e);
                }
            } else {
                console.log('⚠ ไม่พบข้อมูลใน localStorage');
                console.log('   💡 คำแนะนำ: ต้อง login ก่อน หรือ API ต้องส่งข้อมูลกลับมา');
            }

            // Helper function สำหรับจัดการ response
            async function handleResponse(response, endpoint) {
                try {
                    const responseText = await response.text();
                    console.log(`   Response text:`, responseText);
                    const data = JSON.parse(responseText);
                    
                    console.log(`✓ ได้รับข้อมูลจาก ${endpoint}:`, data);
                    console.log('   Response type:', Array.isArray(data) ? 'Array' : typeof data);
                    console.log('   Fields ที่มี:', Array.isArray(data) ? `Array[${data.length}]` : Object.keys(data));
                    
                    // ✅ บันทึก token ถ้ามี (รองรับหลายรูปแบบ)
                    let tokenToSave = null;
                    if (data.session && data.session.access_token) {
                        tokenToSave = data.session.access_token;
                        console.log('   ✓ พบ token ใน data.session.access_token');
                    } else if (data.token) {
                        tokenToSave = data.token;
                        console.log('   ✓ พบ token ใน data.token');
                    } else if (data.accessToken) {
                        tokenToSave = data.accessToken;
                        console.log('   ✓ พบ token ใน data.accessToken');
                    } else if (data.access_token) {
                        tokenToSave = data.access_token;
                        console.log('   ✓ พบ token ใน data.access_token');
                    }
                    
                    if (tokenToSave) {
                        localStorage.setItem('token', tokenToSave);
                        console.log('   ✓ บันทึก token ใหม่');
                    }
                    
                    // ตรวจสอบโครงสร้างข้อมูล (อาจอยู่ใน data.user, data.data, array, หรือ data โดยตรง)
                    let userData = null;
                    
                    // ถ้าเป็น array ให้ใช้ element แรก (สำหรับ bmi_records endpoint)
                    if (Array.isArray(data) && data.length > 0) {
                        // หา record ล่าสุด (อาจจะเรียงตาม id หรือ created_at)
                        userData = data[0];
                        console.log('   ✓ ข้อมูลอยู่ใน array[0]');
                        console.log(`   ✓ พบ ${data.length} records`);
                    } else if (data.user) {
                        userData = data.user;
                        console.log('   ✓ ข้อมูลอยู่ใน data.user');
                    } else if (data.data) {
                        // ถ้า data เป็น array ให้ใช้ element แรก
                        if (Array.isArray(data.data) && data.data.length > 0) {
                            userData = data.data[0];
                            console.log('   ✓ ข้อมูลอยู่ใน data.data[0]');
                        } else {
                            userData = data.data;
                            console.log('   ✓ ข้อมูลอยู่ใน data.data');
                        }
                    } else if (data.username || data.email || data.weight || data.height || data.bmi || data.calories) {
                        // ถ้ามี field ที่เป็นข้อมูลผู้ใช้ แสดงว่า data คือ userData
                        userData = data;
                        console.log('   ✓ ข้อมูลอยู่ใน data โดยตรง');
                    }
                    
                    if (userData) {
                        console.log('   ข้อมูลผู้ใช้:', userData);
                        console.log('   Fields ที่มี:', Object.keys(userData));
                        console.log('   weight:', userData.weight);
                        console.log('   height:', userData.height);
                        console.log('   bmi:', userData.bmi);
                        console.log('   calories:', userData.calories);
                        
                        // ตรวจสอบว่ามีข้อมูล BMI หรือไม่
                        const hasBmiData = (userData.weight !== undefined && userData.weight !== null && userData.weight !== '') ||
                                          (userData.height !== undefined && userData.height !== null && userData.height !== '') ||
                                          (userData.bmi !== undefined && userData.bmi !== null && userData.bmi !== '') ||
                                          (userData.calories !== undefined && userData.calories !== null && userData.calories !== '');
                        
                        // ตรวจสอบว่ามีข้อมูลผู้ใช้หรือไม่ (ไม่ว่าจะมี weight/height/bmi/calories หรือไม่)
                        const hasUserData = userData.username || userData.email || hasBmiData;
                        
                        if (hasUserData) {
                            console.log('✓ ข้อมูลถูกต้อง - บันทึกลง localStorage และแสดงผล');
                            
                            // บันทึก user_id ถ้ามี (สำคัญสำหรับ RLS)
                            if (userData.id) {
                                localStorage.setItem('userId', userData.id);
                                localStorage.setItem('user_id', userData.id);
                                console.log('   ✓ บันทึก user_id:', userData.id);
                            } else if (userData.user_id) {
                                localStorage.setItem('userId', userData.user_id);
                                localStorage.setItem('user_id', userData.user_id);
                                console.log('   ✓ บันทึก user_id:', userData.user_id);
                            } else if (userData.userId) {
                                localStorage.setItem('userId', userData.userId);
                                localStorage.setItem('user_id', userData.userId);

        // ฟังก์ชันแสดงข้อมูลผู้ใช้
        function displayUserData(data) {
            console.log('=== แสดงข้อมูลผู้ใช้ ===');
            console.log('ข้อมูลทั้งหมด:', data);

            // Username
            if (data.username) {
                document.getElementById('usernameValue').textContent = data.username;
                console.log('✓ Username:', data.username);
            } else if (data.email) {
                document.getElementById('usernameValue').textContent = data.email;
                console.log('✓ Email:', data.email);
            } else {
                document.getElementById('usernameValue').textContent = 'ไม่พบข้อมูล';
                console.warn('⚠ ไม่พบ username หรือ email');
            }

            // Password (แสดงเป็นจุด)
            if (data.password) {
                const passwordLength = data.password.length;
                document.getElementById('passwordValue').textContent = '•'.repeat(Math.min(passwordLength, 15));
            }

            // น้ำหนัก (weight) - รองรับทั้ง number และ string, รวมถึง 0
            const weightValue = data.weight;
            if (weightValue !== undefined && weightValue !== null && weightValue !== '') {
                const weight = typeof weightValue === 'number' ? weightValue : parseFloat(weightValue);
                if (!isNaN(weight) && weight >= 0 && weight < 1000) {
                    document.getElementById('weightValue').textContent = `${weight} กก.`;
                    console.log('✓ น้ำหนัก:', weight);
                } else {
                    document.getElementById('weightValue').textContent = '-';
                    console.warn('⚠ น้ำหนักไม่ถูกต้อง:', weightValue);
                }
            } else {
                document.getElementById('weightValue').textContent = '-';
                console.warn('⚠ ไม่พบข้อมูลน้ำหนัก');
            }

            // ส่วนสูง (height) - รองรับทั้ง number และ string, รวมถึง 0
            const heightValue = data.height;
            if (heightValue !== undefined && heightValue !== null && heightValue !== '') {
                const height = typeof heightValue === 'number' ? heightValue : parseFloat(heightValue);
                if (!isNaN(height) && height >= 0 && height < 300) {
                    document.getElementById('heightValue').textContent = `${height} ซม.`;
                    console.log('✓ ส่วนสูง:', height);
                } else {
                    document.getElementById('heightValue').textContent = '-';
                    console.warn('⚠ ส่วนสูงไม่ถูกต้อง:', heightValue);
                }
            } else {
                document.getElementById('heightValue').textContent = '-';
                console.warn('⚠ ไม่พบข้อมูลส่วนสูง');
            }

            // BMI - รองรับทั้ง number และ string, รวมถึง 0
            const bmiValue = data.bmi;
            if (bmiValue !== undefined && bmiValue !== null && bmiValue !== '') {
                const bmi = typeof bmiValue === 'number' ? bmiValue : parseFloat(bmiValue);
                if (!isNaN(bmi) && bmi >= 0 && bmi < 100) {
                    document.getElementById('bmiValue').textContent = bmi.toFixed(2);
                    console.log('✓ BMI:', bmi);
                } else {
                    document.getElementById('bmiValue').textContent = '-';
                    console.warn('⚠ BMI ไม่ถูกต้อง:', bmiValue);
                }
            } else {
                document.getElementById('bmiValue').textContent = '-';
                console.warn('⚠ ไม่พบข้อมูล BMI');
            }

            // แคลอรี่ที่ควรได้รับ (calories) - รองรับทั้ง number และ string, และทั้ง calories และ calorie, รวมถึง 0
            const caloriesValue = data.calories !== undefined ? data.calories : data.calorie;
            if (caloriesValue !== undefined && caloriesValue !== null && caloriesValue !== '') {
                const calories = typeof caloriesValue === 'number' ? caloriesValue : parseFloat(caloriesValue);
                if (!isNaN(calories) && calories >= 0 && calories < 10000) {
                    document.getElementById('caloriesValue').textContent = calories.toFixed(2);
                    console.log('✓ แคลอรี่:', calories);
                } else {
                    document.getElementById('caloriesValue').textContent = '-';
                    console.warn('⚠ แคลอรี่ไม่ถูกต้อง:', caloriesValue);
                }
            } else {
                document.getElementById('caloriesValue').textContent = '-';
                console.warn('⚠ ไม่พบข้อมูลแคลอรี่');
            }
            
            console.log('=== สิ้นสุดการแสดงข้อมูล ===');
        }

        // ฟังก์ชันตั้งค่า UI ของหน้าโปรไฟล์
        function initProfileUI() {
            // avatar
            const changeAvatarBtn = document.getElementById('changeAvatarBtn');
            const avatarInput = document.getElementById('avatarInput');
            const avatarImage = document.getElementById('avatarImage');

            if (changeAvatarBtn && avatarInput) {
                changeAvatarBtn.addEventListener('click', () => {
                    avatarInput.click();
                });

                avatarInput.addEventListener('change', (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        showProfileMessage('กรุณาเลือกรูปภาพเท่านั้น', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const dataUrl = evt.target.result;
                        if (avatarImage) {
                            avatarImage.src = dataUrl;
                            avatarImage.style.display = 'block';
                        }
                        localStorage.setItem('userAvatar', dataUrl);
                        showProfileMessage('อัปเดตรูปโปรไฟล์เรียบร้อย', 'success');
                    };
                    reader.readAsDataURL(file);
                });
            }

            // toggle ส่วนแก้ไข BMI
            const toggleBmiBtn = document.getElementById('toggleBmiEditBtn');
            const bmiSection = document.getElementById('bmiEditSection');
            const cancelBmiBtn = document.getElementById('cancelBmiBtn');
            const saveBmiBtn = document.getElementById('saveBmiBtn');

            if (toggleBmiBtn && bmiSection) {
                toggleBmiBtn.addEventListener('click', () => {
                    const isVisible = bmiSection.style.display === 'block';
                    bmiSection.style.display = isVisible ? 'none' : 'block';
                });
            }
            if (cancelBmiBtn && bmiSection) {
                cancelBmiBtn.addEventListener('click', () => {
                    bmiSection.style.display = 'none';
                });
            }
            if (saveBmiBtn) {
                saveBmiBtn.addEventListener('click', () => {
                    const weightInput = document.getElementById('editWeight');
                    const heightInput = document.getElementById('editHeight');
                    const weight = parseFloat(weightInput.value);
                    const height = parseFloat(heightInput.value);

                    if ((weightInput.value && (isNaN(weight) || weight <= 0)) ||
                        (heightInput.value && (isNaN(height) || height <= 0))) {
                        showProfileMessage('กรุณากรอกค่าน้ำหนักและส่วนสูงให้ถูกต้อง', 'error');
                        return;
                    }

                    if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                        showProfileMessage('กรุณากรอกค่าน้ำหนักและส่วนสูงให้ถูกต้อง', 'error');
                        return;
                    }

                    // คำนวณ BMI และแคลอรี่แบบเดียวกับหน้า Sign up
                    const heightInMeters = height / 100;
                    const bmi = weight / (heightInMeters * heightInMeters);
                    const calories = (10 * weight) + (6.25 * height) - 125;
                    const bmiRounded = parseFloat(bmi.toFixed(2));
                    const caloriesRounded = Math.round(calories);

                    // อ่าน userData เดิมจาก localStorage
                    const savedUser = localStorage.getItem('userData');
                    let userData = savedUser ? JSON.parse(savedUser) : {};

                    userData.weight = weight;
                    userData.height = height;
                    userData.bmi = bmiRounded;
                    userData.calories = caloriesRounded;

                    // บันทึกลง Supabase ผ่าน API
                    (async () => {
                        try {
                            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                            const rawUserId = localStorage.getItem('userId') || localStorage.getItem('user_id');

                            if (!rawUserId) {
                                console.warn('⚠ ไม่พบ userId ใน localStorage ขณะบันทึก BMI');
                            }

                            // แปลง user_id ให้เหมาะสมกับ backend (เหมือนใน cart.js)
                            let userIdForAPI = rawUserId;
                            if (rawUserId) {
                                const isUUID = rawUserId.includes('-') || rawUserId.length > 10;
                                userIdForAPI = isUUID ? rawUserId : parseInt(rawUserId);
                            }

                            const apiBase = 'https://heath-check-436133641220.asia-southeast1.run.app';
                            const headers = {
                                'Content-Type': 'application/json',
                            };
                            if (token) {
                                headers['Authorization'] = `Bearer ${token}`;
                            }

                            const body = {
                                user_id: userIdForAPI,
                                weight: weight,
                                height: height,
                                bmi: bmiRounded,
                                calories: caloriesRounded
                            };

                            const resp = await fetch(`${apiBase}/api/data/bmi_records`, {
                                method: 'POST',
                                headers,
                                body: JSON.stringify(body)
                            });

                            if (!resp.ok) {
                                const text = await resp.text();
                                console.error('❌ บันทึก BMI ไปยัง API ไม่สำเร็จ:', resp.status, text);
                                showProfileMessage('บันทึกข้อมูล BMI ไปยังเซิร์ฟเวอร์ไม่สำเร็จ แต่บันทึกในเครื่องแล้ว', 'error');
                            } else {
                                console.log('✅ บันทึก BMI ไปยัง API สำเร็จ');
                                showProfileMessage('บันทึกข้อมูล BMI และแคลอรี่เรียบร้อย', 'success');
                                // Also try to write to Supabase directly (if configured)
                                try {
                                    const sup = getSupabaseClient();
                                    if (sup && userIdForAPI) {
                                        const insertObj = {
                                            user_id: userIdForAPI,
                                            weight: weight,
                                            height: height,
                                            bmi: bmiRounded,
                                            calories: caloriesRounded
                                        };
                                        const { data: inserted, error: insertErr } = await sup.from('bmi_records').insert([insertObj]);
                                        if (insertErr) {
                                            console.warn('⚠ Supabase insert error:', insertErr);
                                        } else {
                                            console.log('✓ บันทึก BMI ลง Supabase สำเร็จ:', inserted);
                                        }
                                    }
                                } catch (e) {
                                    console.warn('⚠ Supabase write failed:', e.message || e);
                                }
                            }
                        } catch (err) {
                            console.error('❌ Error ขณะบันทึก BMI ไปยัง Supabase:', err);
                            showProfileMessage('เกิดข้อผิดพลาดระหว่างเชื่อมต่อเซิร์ฟเวอร์ แต่บันทึกในเครื่องแล้ว', 'error');
                        }
                    })();

                    // บันทึกลง localStorage และอัปเดต UI ทันที
                    localStorage.setItem('userData', JSON.stringify(userData));
                    displayUserData(userData);
                    if (bmiSection) bmiSection.style.display = 'none';
                });
            }

            // toggle ส่วนเปลี่ยนรหัสผ่าน
            const togglePwdBtn = document.getElementById('togglePasswordEditBtn');
            const pwdSection = document.getElementById('passwordEditSection');
            const cancelPwdBtn = document.getElementById('cancelPasswordBtn');
            const savePwdBtn = document.getElementById('savePasswordBtn');

            if (togglePwdBtn && pwdSection) {
                togglePwdBtn.addEventListener('click', () => {
                    const isVisible = pwdSection.style.display === 'block';
                    pwdSection.style.display = isVisible ? 'none' : 'block';
                });
            }
            if (cancelPwdBtn && pwdSection) {
                cancelPwdBtn.addEventListener('click', () => {
                    pwdSection.style.display = 'none';
                });
            }
            if (savePwdBtn) {
                savePwdBtn.addEventListener('click', () => {
                    const currentPwd = document.getElementById('currentPassword').value;
                    const newPwd = document.getElementById('newPassword').value;
                    const confirmPwd = document.getElementById('confirmNewPassword').value;

                    if (!newPwd || newPwd.length < 6) {
                        showProfileMessage('รหัสผ่านใหม่ต้องยาวอย่างน้อย 6 ตัวอักษร', 'error');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        showProfileMessage('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน', 'error');
                        return;
                    }

                    // ในเวอร์ชันนี้จะอัปเดตรหัสผ่านเฉพาะใน localStorage
                    const savedUser = localStorage.getItem('userData');
                    let userData = savedUser ? JSON.parse(savedUser) : {};
                    userData.password = newPwd;
                    localStorage.setItem('userData', JSON.stringify(userData));
                    displayUserData(userData);
                    showProfileMessage('เปลี่ยนรหัสผ่านเรียบร้อย (เก็บในเครื่อง)', 'success');

                    // Also attempt to update password in Supabase users table if configured
                    (async () => {
                        try {
                            const rawUserId = localStorage.getItem('userId') || localStorage.getItem('user_id');
                            let userIdForAPI = rawUserId;
                            if (rawUserId) {
                                const isUUID = rawUserId.includes('-') || rawUserId.length > 10;
                                userIdForAPI = isUUID ? rawUserId : parseInt(rawUserId);
                            }
                            const sup = getSupabaseClient();
                            if (sup && userIdForAPI) {
                                const { data, error } = await sup.from('users').update({ password: newPwd }).eq('id', userIdForAPI);
                                if (error) console.warn('⚠ Supabase update password error:', error);
                                else console.log('✓ Updated password in Supabase users table:', data);
                            }
                        } catch (e) {
                            console.warn('⚠ Supabase password update failed:', e.message || e);
                        }
                    })();

                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmNewPassword').value = '';
                    if (pwdSection) pwdSection.style.display = 'none';
                });
            }
        }
        
        // ฟังก์ชันทดสอบ API (สำหรับ debug)
        async function testBMIAPI() {
            const userId = localStorage.getItem('userId') || localStorage.getItem('user_id');
            const token = localStorage.getItem('token');
            
            console.log('🧪 === ทดสอบ API ===');
            console.log('User ID:', userId);
            console.log('Token:', token ? '✓ มี' : '✗ ไม่มี');
            
            if (!userId) {
                console.error('❌ ไม่มี User ID - ไม่สามารถทดสอบ API ได้');
                return;
            }
            
            const testEndpoints = [
                `https://heath-check-436133641220.asia-southeast1.run.app/api/data/bmi_records?user_id=${userId}`,
                `https://heath-check-436133641220.asia-southeast1.run.app/api/data/bmi_records`,
                `https://heath-check-436133641220.asia-southeast1.run.app/api/auth/profile?user_id=${userId}`,
                `https://heath-check-436133641220.asia-southeast1.run.app/api/users/profile?user_id=${userId}`
            ];
            
            for (const endpoint of testEndpoints) {
                try {
                    console.log(`\n🧪 ทดสอบ: ${endpoint}`);
                    const headers = {
                        'Content-Type': 'application/json'
                    };
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }
                    
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        headers: headers
                    });
                    
                    console.log(`   Status: ${response.status} ${response.statusText}`);
                    
                    if (response.ok) {
                        const text = await response.text();
                        console.log(`   Response:`, text);
                        try {
                            const data = JSON.parse(text);
                            console.log(`   Parsed:`, data);
                            if (Array.isArray(data)) {
                                console.log(`   Array length: ${data.length}`);
                                if (data.length > 0) {
                                    console.log(`   First item:`, data[0]);
                                }
                            }
                        } catch (e) {
                            console.log(`   Not JSON`);
                        }
                    } else {
                        const errorText = await response.text().catch(() => '');
                        console.log(`   Error:`, errorText);
                    }
                } catch (error) {
                    console.error(`   Exception:`, error.message);
                }
            }
        }
        
        // อัปเดต badge และดึงข้อมูลผู้ใช้เมื่อโหลดหน้า
        window.addEventListener('DOMContentLoaded', () => {
            updateCartBadge();
            loadAvatarFromStorage();
            fetchUserData();
            initProfileUI();
            // One-time Supabase config check
            try {
                const sup = getSupabaseClient();
                if (!sup) {
                    console.warn('Supabase client not configured. Set values in supabase-config.js or localStorage.');
                    showProfileMessage('Supabase ยังไม่ได้ตั้งค่า — remote sync จะไม่ทำงาน', 'error');
                } else {
                    console.log('Supabase client initialized');
                }
            } catch (e) {
                console.warn('Error checking Supabase config:', e.message || e);
            }
            
            // ทดสอบ API หลังจาก 2 วินาที (ให้ fetchUserData ทำงานก่อน)
            setTimeout(() => {
                console.log('\n\n🧪 ========================================');
                console.log('🧪 เริ่มทดสอบ API เพื่อตรวจสอบปัญหา');
                console.log('🧪 ========================================\n');
                testBMIAPI();
            }, 2000);
        });
    </script>
